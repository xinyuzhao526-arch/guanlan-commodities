name: Daily commodity research

on:
  schedule:
    # UTC; Shanghai 18:17 and 20:17, Monday-Friday. Avoid the hourly rush.
    - cron: '17 10,12 * * 1-5'
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Optional target close date (YYYY-MM-DD); blank = latest closed weekday'
        required: false
        type: string
      rebuild:
        description: 'Revalidate the same published day (never permits rollback)'
        default: false
        type: boolean
  push:
    branches: [main]
    paths: ['dist/**', 'scripts/**', 'requirements.txt', '.github/workflows/daily-update.yml']

permissions:
  contents: read

concurrency:
  group: commodity-research-production
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: commodity-raw-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: commodity-raw-v1-
      - name: Verify research arithmetic and refresh transaction
        run: |
          python scripts/check_analysis.py
          python -m unittest discover -s tests -v
      - name: Fetch and validate all exchanges
        id: refresh
        if: github.event_name != 'push'
        env:
          TARGET_DATE: ${{ inputs.as_of }}
          REBUILD: ${{ inputs.rebuild }}
        shell: bash
        run: |
          args=()
          if [ -n "$TARGET_DATE" ]; then args+=(--as-of "$TARGET_DATE"); fi
          if [ "$REBUILD" = "true" ]; then args+=(--rebuild); fi
          python scripts/refresh_daily.py "${args[@]}"
      - name: Save validated source cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: commodity-raw-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build offline HTML
        run: python scripts/export_html.py --output dist/guanlan.html
      - name: Commit the complete snapshot
        if: steps.refresh.outputs.changed == 'true'
        env:
          SNAPSHOT_DATE: ${{ steps.refresh.outputs.as_of }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data.json
          git diff --cached --quiet && exit 0
          git commit -m "data: update commodity close $SNAPSHOT_DATE"
          git push origin HEAD:${{ github.event.repository.default_branch }}
      - name: Downloadable offline dashboard
        uses: actions/upload-artifact@v4
        with:
          name: guanlan-offline-${{ github.run_number }}
          path: dist/guanlan.html
          if-no-files-found: error
          retention-days: 30
      - name: Prepare Pages site
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages:
    if: vars.ENABLE_GITHUB_PAGES == 'true'
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy online dashboard
        id: deployment
        uses: actions/deploy-pages@v4
